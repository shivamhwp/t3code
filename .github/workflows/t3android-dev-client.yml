name: t3android dev client

# Temporary: builds an Android dev client for current main without EAS, so the
# corex phones can run main's JS. Lives only on a fork branch.
on:
  push:
    branches: [t3android/devclient-build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: development
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
      - name: Point expo-widgets at the current peek package
        run: |
          for d in node_modules/.pnpm/expo-widgets@*/node_modules/expo-widgets/android/src; do
            grep -rl 'io.github.jakex7.peek' "$d" | xargs -r sed -i 's/io\.github\.jakex7\.peek/io.github.expo.peek/g'
          done
          grep -rn 'jakex7' node_modules/.pnpm/expo-widgets@*/node_modules/expo-widgets/android/src || true
          # expo-modules-core 58.0.19 rejects classes without a constructor.
          for f in node_modules/.pnpm/expo-widgets@*/node_modules/expo-widgets/android/src/main/java/expo/modules/widgets/WidgetsModule.kt; do
            sed -i 's/    Class("CustomNotification", CustomNotification::class) {/    Class("CustomNotification", CustomNotification::class) {\n      Constructor { -> throw IllegalStateException("CustomNotification is not constructible") }/' "$f"
            grep -n -A1 'Class("CustomNotification"' "$f"
          done
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: t3code-devci
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
